plugins { id 'com.android.application' }

android { namespace 'np.com.laxmannepal.texttohandwriting.offline'; compileSdk 37
    defaultConfig { applicationId 'np.com.laxmannepal.texttohandwriting'; minSdk 24; targetSdk 37; versionCode 1; versionName '1.1.0' }
    buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
}

dependencies { implementation 'androidx.webkit:webkit:1.17.0' }
