name: Android APK (PWA/TWA)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Android version name'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Android version code'
        required: true
        default: '1'
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

env:
  APP_URL: https://apps.laxmannepal.com.np/Text-To-Handwriting/manifest.webmanifest
  APP_START_URL: /Text-To-Handwriting/?source=android
  PACKAGE_ID: np.com.laxmannepal.texttohandwriting

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Verify toolchain
        run: |
          set -euo pipefail
          java -version
          node --version
          npm --version
          bubblewrap --version

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.TTH_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TTH_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TTH_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TTH_KEY_ALIAS }}
        run: |
          set -euo pipefail
          rm -rf android
          mkdir -p android
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "Using stable repository signing key."
            printf '%s' "$KEYSTORE_B64" | base64 --decode > android/android-keystore
            echo "BUILD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "BUILD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "BUILD_KEY_ALIAS=${KEY_ALIAS:-android}" >> "$GITHUB_ENV"
            echo "STABLE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "No stable signing secrets configured; creating a temporary CI signing key."
            PASS='temporary-tth-ci-key-2026'
            keytool -genkeypair -v -keystore android/android-keystore -alias android \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
              -dname 'CN=Text to Handwriting, OU=Laxman Nepal, O=Laxman Nepal, C=NP'
            echo "BUILD_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "BUILD_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "BUILD_KEY_ALIAS=android" >> "$GITHUB_ENV"
            echo "STABLE_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Initialize Bubblewrap project non-interactively
        shell: python
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.BUILD_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.BUILD_KEY_PASSWORD }}
        run: |
          import os
          import subprocess
          from pathlib import Path

          # Bubblewrap's init command is interactive. Feed valid answers through
          # stdin instead of `yes | head`, which causes a SIGPIPE/exit 141 on CI.
          answers = [
              '',
              '',
              'Text to Handwriting',
              'Handwriting',
              'np.com.laxmannepal.texttohandwriting',
              '${{ inputs.version_code || github.run_number }}',
              'standalone',
              'default',
              '#0284c7',
              '#ffffff',
              'https://apps.laxmannepal.com.np/Text-To-Handwriting/icons/icon-512.png',
              '',
              '',
              'n',
              'n',
              'NP',
              'Laxman Nepal',
              'Apps',
              'Laxman Nepal',
              os.environ['BUBBLEWRAP_KEYSTORE_PASSWORD'],
              os.environ['BUBBLEWRAP_KEY_PASSWORD'],
          ]
          input_data = '\n'.join(answers) + '\n'
          result = subprocess.run([
              'bubblewrap', 'init',
              '--manifest', os.environ['APP_URL'],
              '--directory', 'android'
          ], input=input_data, text=True, capture_output=True)
          print(result.stdout)
          print(result.stderr)
          if result.returncode != 0:
              raise SystemExit(f'Bubblewrap init failed with exit code {result.returncode}')

      - name: Set Android identity and version
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('android/twa-manifest.json')
          if not p.exists():
              raise SystemExit('android/twa-manifest.json was not generated')
          d = json.loads(p.read_text())
          d['name'] = 'Text to Handwriting'
          d['launcherName'] = 'Handwriting'
          d['packageId'] = 'np.com.laxmannepal.texttohandwriting'
          d['startUrl'] = '/Text-To-Handwriting/?source=android'
          d['appVersion'] = '${{ inputs.version_name || github.ref_name }}'.replace('android-v','')
          d['appVersionCode'] = int('${{ inputs.version_code || github.run_number }}')
          d['signingKey']['path'] = str(Path.cwd() / 'android/android-keystore')
          d['signingKey']['alias'] = '${{ env.BUILD_KEY_ALIAS }}'
          p.write_text(json.dumps(d, indent=2) + '\n')

      - name: Regenerate Android project from final manifest
        run: bubblewrap update --skipVersionUpgrade --manifest=android/twa-manifest.json

      - name: Build signed APK and AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.BUILD_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.BUILD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bubblewrap build --manifest=android/twa-manifest.json
          test -f android/app-release-signed.apk
          test -f android/app-release-bundle.aab
          cp android/app-release-signed.apk Text-To-Handwriting.apk
          cp android/app-release-bundle.aab Text-To-Handwriting.aab

      - name: Verify artifacts
        run: |
          set -euo pipefail
          unzip -l Text-To-Handwriting.apk | grep -q 'AndroidManifest.xml'
          test -s Text-To-Handwriting.apk
          test -s Text-To-Handwriting.aab
          sha256sum Text-To-Handwriting.apk Text-To-Handwriting.aab | tee SHA256SUMS.txt

      - name: Generate signing fingerprint
        run: |
          keytool -list -v -keystore android/android-keystore \
            -storepass "$BUILD_KEYSTORE_PASSWORD" -alias "$BUILD_KEY_ALIAS" \
            | grep -E 'SHA256:' | tee signing-fingerprint.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: text-to-handwriting-android-${{ inputs.version_name || github.run_number }}
          path: |
            Text-To-Handwriting.apk
            Text-To-Handwriting.aab
            SHA256SUMS.txt
            signing-fingerprint.txt
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v') && env.STABLE_SIGNING == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Text-To-Handwriting.apk
            Text-To-Handwriting.aab
            SHA256SUMS.txt
            signing-fingerprint.txt
          generate_release_notes: true
          name: Text to Handwriting ${{ github.ref_name }}
