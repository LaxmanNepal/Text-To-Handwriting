name: Build Ready-to-Install APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: App version name
        required: true
        default: '1.0.0'
      version_code:
        description: Android version code
        required: true
        default: '1'

permissions:
  contents: read

env:
  PACKAGE_ID: np.com.laxmannepal.texttohandwriting
  COMPILE_SDK: '35'
  BUILD_TOOLS: '35.0.0'

jobs:
  build-apk:
    name: Build signed installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -d "$SDK"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Validate inputs and project
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.version_code }}" =~ ^[1-9][0-9]*$ ]] || { echo 'version_code must be a positive integer'; exit 1; }
          [[ "${{ inputs.version_name }}" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]] || { echo 'Invalid version_name'; exit 1; }
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/np/com/laxmannepal/texttohandwriting/MainActivity.java

      - name: Prepare permanent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          mkdir -p android/keystore dist
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/keystore/release.keystore
          keytool -list -keystore android/keystore/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "RELEASE_KEYSTORE=$GITHUB_WORKSPACE/android/keystore/release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          cd android
          gradle --no-daemon --stacktrace clean assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../dist/Text-To-Handwriting-${VERSION_NAME}-${VERSION_CODE}.apk"

      - name: Verify APK and generate fingerprints
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/Text-To-Handwriting-${{ inputs.version_name }}-${{ inputs.version_code }}.apk"
          test -s "$APK"
          apksigner verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee dist/SHA256SUM.txt
          keytool -list -v -keystore "$RELEASE_KEYSTORE" -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" | grep 'SHA256:' | tee dist/SHA256-CERTIFICATE.txt

      - name: Write build summary
        shell: bash
        run: |
          {
            echo '## Android APK ready'
            echo
            echo "- App: Text to Handwriting"
            echo "- Package: $PACKAGE_ID"
            echo "- Version: ${{ inputs.version_name }} (${{ inputs.version_code }})"
            echo "- Commit: $GITHUB_SHA"
            echo "- APK: Text-To-Handwriting-${{ inputs.version_name }}-${{ inputs.version_code }}.apk"
            echo '- Signed: yes'
            echo '- Verification: passed'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ready-to-install APK
        uses: actions/upload-artifact@v4
        with:
          name: Text-To-Handwriting-APK-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: dist/
          retention-days: 30
