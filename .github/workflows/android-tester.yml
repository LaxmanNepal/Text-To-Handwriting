name: Build Ready-to-Install APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: App version name
        required: true
        default: '1.0.0'
      version_code:
        description: Android version code
        required: true
        default: '1'

permissions:
  contents: read

env:
  PACKAGE_ID: np.com.laxmannepal.texttohandwriting
  APP_URL: https://apps.laxmannepal.com.np/Text-To-Handwriting/
  COMPILE_SDK: '35'
  TARGET_SDK: '35'
  MIN_SDK: '23'
  GRADLE_VERSION: '8.7'

jobs:
  build-apk:
    name: Build signed installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;35.0.0"

      - name: Validate build inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.version_code }}" =~ ^[1-9][0-9]*$ ]] || { echo 'version_code must be a positive integer'; exit 1; }
          [[ "${{ inputs.version_name }}" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]] || { echo 'Invalid version_name'; exit 1; }

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          mkdir -p android-release
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android-release/release.keystore
          keytool -list -keystore android-release/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "RELEASE_KEYSTORE=$GITHUB_WORKSPACE/android-release/release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/android-release"
          PKG="$PACKAGE_ID"
          PKG_PATH="${PKG//./\/}"
          mkdir -p "$ROOT/app/src/main/java/$PKG_PATH" "$ROOT/app/src/main/res/values" "$ROOT/app/src/main/res/drawable"

          cat > "$ROOT/settings.gradle" <<'EOF'
pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
rootProject.name='TextToHandwriting'
include ':app'
EOF

          cat > "$ROOT/build.gradle" <<'EOF'
plugins { id 'com.android.application' version '8.6.1' apply false }
EOF

          cat > "$ROOT/gradle.properties" <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
EOF

          cat > "$ROOT/app/build.gradle" <<'EOF'
plugins { id 'com.android.application' }

android {
    namespace 'np.com.laxmannepal.texttohandwriting'
    compileSdk 35
    defaultConfig {
        applicationId 'np.com.laxmannepal.texttohandwriting'
        minSdk 23
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('VERSION_CODE'))
        versionName System.getenv('VERSION_NAME')
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('RELEASE_KEYSTORE'))
            storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
            keyAlias System.getenv('RELEASE_KEY_ALIAS')
            keyPassword System.getenv('RELEASE_KEY_PASSWORD')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
}
EOF

          cat > "$ROOT/app/src/main/res/values/strings.xml" <<'EOF'
<resources><string name="app_name">Text to Handwriting</string></resources>
EOF

          cat > "$ROOT/app/src/main/res/values/colors.xml" <<'EOF'
<resources><color name="app_primary">#0284C7</color></resources>
EOF

          cat > "$ROOT/app/src/main/res/values/themes.xml" <<'EOF'
<resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">@color/app_primary</item><item name="android:statusBarColor">#0284C7</item><item name="android:navigationBarColor">#000000</item></style></resources>
EOF

          cat > "$ROOT/app/src/main/res/drawable/ic_launcher.xml" <<'EOF'
<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#0284C7" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#FFFFFF" android:pathData="M25,27h58v8h-58zM25,46h58v8h-58zM25,65h40v8h-40z"/></vector>
EOF

          cat > "$ROOT/app/src/main/AndroidManifest.xml" <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <application android:allowBackup="false" android:label="@string/app_name" android:theme="@style/AppTheme" android:usesCleartextTraffic="false" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF

          cat > "$ROOT/app/src/main/java/$PKG_PATH/MainActivity.java" <<'EOF'
package np.com.laxmannepal.texttohandwriting;

import android.app.Activity;
import android.content.Intent;
import android.net.Uri;
import android.os.Bundle;
import android.webkit.WebResourceRequest;
import android.webkit.WebView;
import android.webkit.WebViewClient;

public final class MainActivity extends Activity {
    private WebView webView;
    @Override public void onCreate(Bundle state) {
        super.onCreate(state);
        webView = new WebView(this);
        setContentView(webView);
        webView.setWebViewClient(new WebViewClient() {
            @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                Uri uri = request.getUrl();
                if ("https".equals(uri.getScheme()) && "apps.laxmannepal.com.np".equals(uri.getHost())) return false;
                try { startActivity(new Intent(Intent.ACTION_VIEW, uri)); } catch (Exception ignored) {}
                return true;
            }
        });
        webView.getSettings().setJavaScriptEnabled(true);
        webView.getSettings().setDomStorageEnabled(true);
        webView.getSettings().setAllowFileAccess(false);
        webView.getSettings().setAllowContentAccess(false);
        webView.getSettings().setBuiltInZoomControls(false);
        webView.getSettings().setDisplayZoomControls(false);
        webView.loadUrl("https://apps.laxmannepal.com.np/Text-To-Handwriting/?source=android");
    }
    @Override public void onBackPressed() { if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed(); }
    @Override protected void onDestroy() { if (webView != null) { webView.stopLoading(); webView.destroy(); webView=null; } super.onDestroy(); }
}
EOF

          cd "$ROOT"
          gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin

      - name: Build release APK
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          cd android-release
          ./gradlew --no-daemon clean assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/Text-To-Handwriting-${VERSION_NAME}-${VERSION_CODE}.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/Text-To-Handwriting-${{ inputs.version_name }}-${{ inputs.version_code }}.apk"
          test -s "$APK"
          apksigner verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee dist/SHA256SUM.txt
          keytool -list -v -keystore "$RELEASE_KEYSTORE" -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" | grep 'SHA256:' | tee dist/SHA256-CERTIFICATE.txt

      - name: Upload ready-to-install APK
        uses: actions/upload-artifact@v4
        with:
          name: Text-To-Handwriting-APK-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: dist/
          retention-days: 30
