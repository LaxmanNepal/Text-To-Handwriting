name: Android Tester APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Android version name
        required: true
        default: '1.0.0'
      version_code:
        description: Android version code
        required: true
        default: '1'

permissions:
  contents: read

env:
  MANIFEST_URL: https://apps.laxmannepal.com.np/Text-To-Handwriting/manifest.webmanifest
  HOST: apps.laxmannepal.com.np
  APP_START_URL: /Text-To-Handwriting/?source=android-tester
  PACKAGE_ID: np.com.laxmannepal.texttohandwriting
  ICON_URL: https://apps.laxmannepal.com.np/Text-To-Handwriting/icons/icon.svg

jobs:
  build-apk:
    name: Build tester APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Configure Android SDK environment
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK" && test -d "$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "Using Android SDK: $SDK"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          if [ ! -e "$ANDROID_SDK_ROOT/tools" ]; then
            ln -s "$ANDROID_SDK_ROOT/cmdline-tools/latest" "$ANDROID_SDK_ROOT/tools"
          fi
          test -x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli@1.25.0

      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_SDK_ROOT"
          bubblewrap doctor
          bubblewrap --version

      - name: Create tester signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android
          PASS="tester-${GITHUB_RUN_ID}-only"
          keytool -genkeypair -v \
            -keystore android/tester-keystore.jks \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname 'CN=Text to Handwriting, OU=Laxman Nepal, O=Laxman Nepal, C=NP'
          echo "BUILD_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "BUILD_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "BUILD_KEY_ALIAS=android" >> "$GITHUB_ENV"

      - name: Generate Bubblewrap manifest non-interactively
        shell: python
        env:
          HOST: ${{ env.HOST }}
          APP_START_URL: ${{ env.APP_START_URL }}
          PACKAGE_ID: ${{ env.PACKAGE_ID }}
          MANIFEST_URL: ${{ env.MANIFEST_URL }}
          ICON_URL: ${{ env.ICON_URL }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          import json
          import os
          from pathlib import Path

          version_code = int(os.environ['VERSION_CODE'])
          version_name = os.environ['VERSION_NAME']
          keystore = str((Path.cwd() / 'android/tester-keystore.jks').resolve())

          manifest = {
              'packageId': os.environ['PACKAGE_ID'],
              'host': os.environ['HOST'],
              'name': 'Text to Handwriting',
              'launcherName': 'Handwriting',
              'display': 'standalone',
              'themeColor': '#0284c7',
              'themeColorDark': '#0284c7',
              'navigationColor': '#0284c7',
              'navigationColorDark': '#000000',
              'navigationDividerColor': '#000000',
              'navigationDividerColorDark': '#000000',
              'backgroundColor': '#f1f5f9',
              'startUrl': os.environ['APP_START_URL'],
              'iconUrl': os.environ['ICON_URL'],
              'splashScreenFadeOutDuration': 300,
              'signingKey': {
                  'path': keystore,
                  'alias': 'android'
              },
              'appVersionName': version_name,
              'appVersionCode': version_code,
              'appVersion': version_name,
              'shortcuts': [],
              'generatorApp': 'bubblewrap-cli',
              'webManifestUrl': os.environ['MANIFEST_URL'],
              'fallbackType': 'customtabs',
              'features': {},
              'alphaDependencies': {'enabled': False},
              'enableSiteSettingsShortcut': True,
              'isChromeOSOnly': False,
              'isMetaQuest': False,
              'fullScopeUrl': 'https://' + os.environ['HOST'] + '/Text-To-Handwriting/',
              'minSdkVersion': 23,
              'orientation': 'default',
              'fingerprints': [],
              'additionalTrustedOrigins': [],
              'retainedBundles': [],
              'protocolHandlers': [],
              'fileHandlers': [],
              'launchHandlerClientMode': ''
          }

          path = Path('android/twa-manifest.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(path.read_text(encoding='utf-8'))

      - name: Validate Bubblewrap manifest
        shell: python
        run: |
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          p = Path('android/twa-manifest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          required = ['packageId', 'host', 'name', 'startUrl', 'iconUrl', 'signingKey']
          missing = [key for key in required if not data.get(key)]
          if missing:
              raise SystemExit('Missing Bubblewrap fields: ' + ', '.join(missing))
          if urlparse('https://' + data['host']).hostname != data['host']:
              raise SystemExit('Invalid host: ' + data['host'])
          if not data['startUrl'].startswith('/'):
              raise SystemExit('startUrl must be relative: ' + data['startUrl'])
          if data['packageId'] != '${{ env.PACKAGE_ID }}':
              raise SystemExit('Unexpected package ID')
          print('Bubblewrap manifest validation passed.')

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          bubblewrap update --manifest=android/twa-manifest.json --skipVersionUpgrade
          test -f android/twa-manifest.json
          test -f android/build.gradle || test -f android/build.gradle.kts
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts

      - name: Build tester APK
        shell: bash
        run: |
          set -euo pipefail
          bubblewrap build --manifest=android/twa-manifest.json \
            --signingKeyPath="$GITHUB_WORKSPACE/android/tester-keystore.jks" \
            --signingKeyAlias="$BUILD_KEY_ALIAS"
          test -s android/app-release-signed.apk
          mkdir -p dist
          cp android/app-release-signed.apk "dist/Text-To-Handwriting-${{ inputs.version_name }}-tester.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/Text-To-Handwriting-${{ inputs.version_name }}-tester.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          apksigner verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee dist/SHA256SUM.txt
          keytool -list -v -keystore android/tester-keystore.jks -storepass "$BUILD_KEYSTORE_PASSWORD" -alias "$BUILD_KEY_ALIAS" | grep 'SHA256:' | tee dist/SHA256-CERTIFICATE.txt

      - name: Upload tester APK
        uses: actions/upload-artifact@v4
        with:
          name: text-to-handwriting-tester-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: dist/
          retention-days: 30
