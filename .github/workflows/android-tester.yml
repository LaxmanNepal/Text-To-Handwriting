name: Android Tester APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Android version name
        required: true
        default: '1.0.0'
      version_code:
        description: Android version code
        required: true
        default: '1'

permissions:
  contents: read

env:
  MANIFEST_URL: https://apps.laxmannepal.com.np/Text-To-Handwriting/manifest.webmanifest
  APP_START_URL: /Text-To-Handwriting/?source=android-tester
  PACKAGE_ID: np.com.laxmannepal.texttohandwriting

jobs:
  build-apk:
    name: Build tester APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Configure Android SDK environment
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "GitHub runner Android SDK was not found"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "Using Android SDK: $SDK"
          echo "Using Java: $JAVA_HOME"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"
            find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          # Bubblewrap's SDK validator accepts an SDK root containing either
          # tools/bin or bin. GitHub-hosted runners use cmdline-tools/latest.
          # Expose the modern directory using the legacy-compatible tools path.
          if [ ! -e "$ANDROID_SDK_ROOT/tools" ]; then
            ln -s "$ANDROID_SDK_ROOT/cmdline-tools/latest" "$ANDROID_SDK_ROOT/tools"
          fi

          test -d "$ANDROID_SDK_ROOT/tools"
          test -x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          test -d "$ANDROID_SDK_ROOT/platform-tools"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

          echo "SDK layout validated for Bubblewrap:"
          ls -ld "$ANDROID_SDK_ROOT/tools"
          ls -ld "$ANDROID_SDK_ROOT/tools/bin"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli@latest

      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF
          echo "Bubblewrap config:"
          cat "$HOME/.bubblewrap/config.json"
          bubblewrap doctor

      - name: Verify toolchain
        run: |
          set -euo pipefail
          java -version
          node --version
          npm --version
          bubblewrap --version

      - name: Create temporary tester signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android
          PASS="tester-${GITHUB_RUN_ID}-only"
          keytool -genkeypair -v \
            -keystore android/tester-keystore.jks \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname 'CN=Text to Handwriting, OU=Laxman Nepal, O=Laxman Nepal, C=NP'
          echo "BUILD_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "BUILD_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "BUILD_KEY_ALIAS=android" >> "$GITHUB_ENV"

      - name: Initialize Bubblewrap project
        shell: python
        env:
          MANIFEST_URL: ${{ env.MANIFEST_URL }}
        run: |
          import os
          import subprocess

          # The manifest supplies the website identity, icon and display values.
          # Bubblewrap still asks for a small number of app-generation choices.
          answers = [
              'Text to Handwriting',
              'Handwriting',
              '${{ env.PACKAGE_ID }}',
              '${{ inputs.version_code }}',
              'standalone',
              'portrait',
              '#0284c7',
              '#f1f5f9',
              'https://apps.laxmannepal.com.np/Text-To-Handwriting/icons/icon.svg',
              '',
              '',
              'n',
              'n',
              'n'
          ]

          proc = subprocess.run(
              ['bubblewrap', 'init', '--manifest', os.environ['MANIFEST_URL'], '--directory', 'android'],
              input='\n'.join(answers) + '\n',
              text=True,
              capture_output=True
          )
          print(proc.stdout)
          print(proc.stderr)
          if proc.returncode != 0:
              raise SystemExit(f'Bubblewrap init failed with exit code {proc.returncode}')

      - name: Configure TWA manifest
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('android/twa-manifest.json')
          if not path.exists():
              raise SystemExit('twa-manifest.json was not generated')

          manifest = json.loads(path.read_text(encoding='utf-8'))
          manifest.update({
              'name': 'Text to Handwriting',
              'launcherName': 'Handwriting',
              'packageId': '${{ env.PACKAGE_ID }}',
              'startUrl': '${{ env.APP_START_URL }}',
              'appVersion': '${{ inputs.version_name }}',
              'appVersionCode': int('${{ inputs.version_code }}')
          })

          signing = manifest.setdefault('signingKey', {})
          signing['path'] = str(Path.cwd() / 'android/tester-keystore.jks')
          signing['alias'] = '${{ env.BUILD_KEY_ALIAS }}'

          path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(path.read_text(encoding='utf-8'))

      - name: Regenerate Android project
        run: bubblewrap update --skipVersionUpgrade --manifest=android/twa-manifest.json

      - name: Build tester APK
        shell: bash
        run: |
          set -euo pipefail
          bubblewrap build --manifest=android/twa-manifest.json
          test -s android/app-release-signed.apk
          mkdir -p dist
          cp android/app-release-signed.apk "dist/Text-To-Handwriting-${{ inputs.version_name }}-tester.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/Text-To-Handwriting-${{ inputs.version_name }}-tester.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          apksigner verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee dist/SHA256SUM.txt
          keytool -list -v \
            -keystore android/tester-keystore.jks \
            -storepass "$BUILD_KEYSTORE_PASSWORD" \
            -alias "$BUILD_KEY_ALIAS" | grep 'SHA256:' | tee dist/SHA256-CERTIFICATE.txt

      - name: Upload tester APK
        uses: actions/upload-artifact@v4
        with:
          name: text-to-handwriting-tester-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: dist/
          retention-days: 30
