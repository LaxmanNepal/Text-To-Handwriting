name: Android Tester APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Android version name
        required: true
        default: '1.0.0'
      version_code:
        description: Android version code
        required: true
        default: '1'

permissions:
  contents: read

env:
  APP_URL: https://apps.laxmannepal.com.np/Text-To-Handwriting/manifest.webmanifest
  APP_START_URL: /Text-To-Handwriting/?source=android
  PACKAGE_ID: np.com.laxmannepal.texttohandwriting

jobs:
  build-apk:
    name: Build tester APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Verify toolchain
        run: |
          set -euo pipefail
          java -version
          node --version
          npm --version
          bubblewrap --version

      - name: Create temporary CI signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android
          keytool -genkeypair -v \
            -keystore android/tester-keystore.jks \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 'tester-only-password' \
            -keypass 'tester-only-password' \
            -dname 'CN=Text to Handwriting, OU=Laxman Nepal, O=Laxman Nepal, C=NP'
          echo 'BUILD_KEYSTORE_PASSWORD=tester-only-password' >> "$GITHUB_ENV"
          echo 'BUILD_KEY_PASSWORD=tester-only-password' >> "$GITHUB_ENV"
          echo 'BUILD_KEY_ALIAS=android' >> "$GITHUB_ENV"

      - name: Initialize Bubblewrap project
        shell: python
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.BUILD_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.BUILD_KEY_PASSWORD }}
        run: |
          import os
          import subprocess

          answers = [
              '',
              '',
              'Text to Handwriting',
              'Handwriting',
              os.environ['PACKAGE_ID'],
              '${{ inputs.version_code }}',
              'standalone',
              'portrait',
              '#0284c7',
              '#ffffff',
              'https://apps.laxmannepal.com.np/Text-To-Handwriting/icons/icon-512.png',
              '',
              '',
              'n',
              'n',
              'n',
              'NP',
              'Laxman Nepal',
              'Apps',
              'Laxman Nepal',
              os.environ['BUBBLEWRAP_KEYSTORE_PASSWORD'],
              os.environ['BUBBLEWRAP_KEY_PASSWORD'],
          ]

          result = subprocess.run(
              ['bubblewrap', 'init', '--manifest', os.environ['APP_URL'], '--directory', 'android'],
              input='\n'.join(answers) + '\n',
              text=True,
              capture_output=True,
          )
          print(result.stdout)
          print(result.stderr)
          if result.returncode != 0:
              raise SystemExit(f'Bubblewrap init failed with exit code {result.returncode}')

      - name: Configure Android project
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('android/twa-manifest.json')
          if not path.exists():
              raise SystemExit('Bubblewrap did not create android/twa-manifest.json')

          manifest = json.loads(path.read_text(encoding='utf-8'))
          manifest['name'] = 'Text to Handwriting'
          manifest['launcherName'] = 'Handwriting'
          manifest['packageId'] = '${{ env.PACKAGE_ID }}'
          manifest['startUrl'] = '${{ env.APP_START_URL }}'
          manifest['appVersion'] = '${{ inputs.version_name }}'
          manifest['appVersionCode'] = int('${{ inputs.version_code }}')
          manifest['signingKey']['path'] = str(Path.cwd() / 'android/tester-keystore.jks')
          manifest['signingKey']['alias'] = '${{ env.BUILD_KEY_ALIAS }}'
          path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

      - name: Regenerate Android project
        run: bubblewrap update --skipVersionUpgrade --manifest=android/twa-manifest.json

      - name: Build signed tester APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.BUILD_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.BUILD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bubblewrap build --manifest=android/twa-manifest.json
          test -s android/app-release-signed.apk
          mkdir -p dist
          cp android/app-release-signed.apk "dist/Text-To-Handwriting-${{ inputs.version_name }}-tester.apk"

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="dist/Text-To-Handwriting-${{ inputs.version_name }}-tester.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          keytool -list -v \
            -keystore android/tester-keystore.jks \
            -storepass "$BUILD_KEYSTORE_PASSWORD" \
            -alias "$BUILD_KEY_ALIAS" \
            | grep 'SHA256:'
          sha256sum "$APK" | tee dist/SHA256SUM.txt

      - name: Upload tester APK
        uses: actions/upload-artifact@v4
        with:
          name: text-to-handwriting-tester-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: dist/
          retention-days: 30
