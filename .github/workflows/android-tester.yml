name: Android Tester APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Android version name
        required: true
        default: '1.0.0'
      version_code:
        description: Android version code
        required: true
        default: '1'

permissions:
  contents: read

env:
  MANIFEST_URL: https://apps.laxmannepal.com.np/Text-To-Handwriting/manifest.webmanifest
  APP_START_URL: /Text-To-Handwriting/?source=android-tester
  PACKAGE_ID: np.com.laxmannepal.texttohandwriting

jobs:
  build-apk:
    name: Build tester APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: ''

      - name: Configure Android SDK environment
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"
          test -d "$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$SDK"

      - name: Accept Android SDK licenses and install build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Configure Bubblewrap non-interactively
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.bubblewrap"
          python - <<'PY'
          import json, os
          from pathlib import Path
          cfg = {
              "jdkPath": os.environ["JAVA_HOME"],
              "androidSdkPath": os.environ["ANDROID_SDK_ROOT"]
          }
          path = Path.home() / '.bubblewrap' / 'config.json'
          path.write_text(json.dumps(cfg, indent=2) + '\n', encoding='utf-8')
          print(path)
          print(json.dumps(cfg, indent=2))
          PY
          bubblewrap doctor

      - name: Verify toolchain
        run: |
          set -euo pipefail
          java -version
          node --version
          npm --version
          bubblewrap --version

      - name: Create temporary tester signing key before Bubblewrap init
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android
          PASS="tester-${GITHUB_RUN_ID}-only"
          keytool -genkeypair -v \
            -keystore android/tester-keystore.jks \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname 'CN=Text to Handwriting, OU=Laxman Nepal, O=Laxman Nepal, C=NP'
          echo "BUILD_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "BUILD_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "BUILD_KEY_ALIAS=android" >> "$GITHUB_ENV"

      - name: Initialize Bubblewrap project without prompts
        shell: python
        env:
          MANIFEST_URL: ${{ env.MANIFEST_URL }}
          APP_START_URL: ${{ env.APP_START_URL }}
          PACKAGE_ID: ${{ env.PACKAGE_ID }}
        run: |
          import os, subprocess
          answers = [
              'apps.laxmannepal.com.np',
              os.environ['APP_START_URL'],
              'Text to Handwriting',
              'Handwriting',
              os.environ['PACKAGE_ID'],
              '${{ inputs.version_code }}',
              'standalone',
              'portrait',
              '#0284c7',
              '#f1f5f9',
              'https://apps.laxmannepal.com.np/Text-To-Handwriting/icons/icon.svg',
              '',
              'y',
              '',
              'n',
              'n',
              'tester-keystore.jks',
              'android'
          ]
          result = subprocess.run(
              ['bubblewrap', 'init', '--manifest', os.environ['MANIFEST_URL'], '--directory', 'android'],
              input='\n'.join(answers) + '\n',
              text=True,
              capture_output=True
          )
          print(result.stdout)
          print(result.stderr)
          if result.returncode != 0:
              raise SystemExit(f'Bubblewrap init failed: {result.returncode}')

      - name: Configure TWA manifest
        shell: python
        run: |
          import json
          from pathlib import Path
          path = Path('android/twa-manifest.json')
          if not path.exists(): raise SystemExit('twa-manifest.json was not generated')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          manifest.update({
              'name': 'Text to Handwriting',
              'launcherName': 'Handwriting',
              'packageId': '${{ env.PACKAGE_ID }}',
              'startUrl': '${{ env.APP_START_URL }}',
              'appVersion': '${{ inputs.version_name }}',
              'appVersionCode': int('${{ inputs.version_code }}')
          })
          manifest['signingKey']['path'] = str(Path.cwd() / 'android/tester-keystore.jks')
          manifest['signingKey']['alias'] = '${{ env.BUILD_KEY_ALIAS }}'
          path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

      - name: Regenerate Android project
        run: bubblewrap update --skipVersionUpgrade --manifest=android/twa-manifest.json

      - name: Build tester APK
        run: |
          set -euo pipefail
          bubblewrap build --manifest=android/twa-manifest.json
          test -s android/app-release-signed.apk
          mkdir -p dist
          cp android/app-release-signed.apk "dist/Text-To-Handwriting-${{ inputs.version_name }}-tester.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/Text-To-Handwriting-${{ inputs.version_name }}-tester.apk"
          unzip -t "$APK" >/dev/null
          apksigner verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee dist/SHA256SUM.txt
          keytool -list -v \
            -keystore android/tester-keystore.jks \
            -storepass "$BUILD_KEYSTORE_PASSWORD" \
            -alias "$BUILD_KEY_ALIAS" | grep 'SHA256:' | tee dist/SHA256-CERTIFICATE.txt

      - name: Upload tester APK
        uses: actions/upload-artifact@v4
        with:
          name: text-to-handwriting-tester-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: dist/
          retention-days: 30
