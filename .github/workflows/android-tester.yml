name: Android Tester APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Android version name
        required: true
        default: '1.0.0'
      version_code:
        description: Android version code
        required: true
        default: '1'

permissions:
  contents: read

env:
  MANIFEST_URL: https://apps.laxmannepal.com.np/Text-To-Handwriting/manifest.webmanifest
  APP_START_URL: /Text-To-Handwriting/?source=android-tester
  PACKAGE_ID: np.com.laxmannepal.texttohandwriting

jobs:
  build-apk:
    name: Build tester APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Configure Android SDK environment
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK" && test -d "$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "Using Android SDK: $SDK"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          if [ ! -e "$ANDROID_SDK_ROOT/tools" ]; then
            ln -s "$ANDROID_SDK_ROOT/cmdline-tools/latest" "$ANDROID_SDK_ROOT/tools"
          fi
          test -x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli@latest

      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.bubblewrap"
          printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > "$HOME/.bubblewrap/config.json"
          bubblewrap doctor

      - name: Create tester signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android
          PASS="tester-${GITHUB_RUN_ID}-only"
          keytool -genkeypair -v \
            -keystore android/tester-keystore.jks \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname 'CN=Text to Handwriting, OU=Laxman Nepal, O=Laxman Nepal, C=NP'
          echo "BUILD_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "BUILD_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "BUILD_KEY_ALIAS=android" >> "$GITHUB_ENV"

      - name: Initialize Bubblewrap project
        shell: python
        env:
          MANIFEST_URL: ${{ env.MANIFEST_URL }}
          APP_START_URL: ${{ env.APP_START_URL }}
          PACKAGE_ID: ${{ env.PACKAGE_ID }}
        run: |
          import os, subprocess

          # Bubblewrap init is interactive. The first two answers are the
          # manifest host and the relative launch path. Previously these were
          # omitted, shifting every subsequent answer into the wrong prompt.
          answers = [
              'apps.laxmannepal.com.np',
              os.environ['APP_START_URL'],
              'Text to Handwriting',
              'Handwriting',
              os.environ['PACKAGE_ID'],
              '${{ inputs.version_code }}',
              '',
              '',
              '',
              '',
              'https://apps.laxmannepal.com.np/Text-To-Handwriting/icons/icon.svg',
              '',
              '',
              'n',
              'n',
              '/home/runner/work/Text-To-Handwriting/Text-To-Handwriting/android/tester-keystore.jks',
              'android'
          ]

          proc = subprocess.run(
              ['bubblewrap', 'init', '--manifest', os.environ['MANIFEST_URL'], '--directory', 'android'],
              input='\n'.join(answers) + '\n',
              text=True,
              capture_output=True
          )
          print(proc.stdout)
          print(proc.stderr)
          if proc.returncode != 0:
              raise SystemExit(f'Bubblewrap init failed with exit code {proc.returncode}')

      - name: Configure TWA manifest and signing
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('android/twa-manifest.json')
          if not path.exists():
              raise SystemExit('twa-manifest.json was not generated')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          manifest['name'] = 'Text to Handwriting'
          manifest['launcherName'] = 'Handwriting'
          manifest['packageId'] = '${{ env.PACKAGE_ID }}'
          manifest['startUrl'] = '${{ env.APP_START_URL }}'
          manifest['appVersion'] = '${{ inputs.version_name }}'
          manifest['appVersionName'] = '${{ inputs.version_name }}'
          manifest['appVersionCode'] = int('${{ inputs.version_code }}')
          signing = manifest.setdefault('signingKey', {})
          signing['path'] = str(Path.cwd() / 'android/tester-keystore.jks')
          signing['alias'] = '${{ env.BUILD_KEY_ALIAS }}'
          path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

      - name: Regenerate Android project
        run: bubblewrap update --skipVersionUpgrade --manifest=android/twa-manifest.json

      - name: Build tester APK
        shell: bash
        run: |
          set -euo pipefail
          bubblewrap build --manifest=android/twa-manifest.json
          test -s android/app-release-signed.apk
          mkdir -p dist
          cp android/app-release-signed.apk "dist/Text-To-Handwriting-${{ inputs.version_name }}-tester.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/Text-To-Handwriting-${{ inputs.version_name }}-tester.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          apksigner verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee dist/SHA256SUM.txt
          keytool -list -v -keystore android/tester-keystore.jks -storepass "$BUILD_KEYSTORE_PASSWORD" -alias "$BUILD_KEY_ALIAS" | grep 'SHA256:' | tee dist/SHA256-CERTIFICATE.txt

      - name: Upload tester APK
        uses: actions/upload-artifact@v4
        with:
          name: text-to-handwriting-tester-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: dist/
          retention-days: 30
