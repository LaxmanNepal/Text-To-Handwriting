name: Enable PWA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject PWA metadata and responsive support
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          if not p.exists():
              raise SystemExit('index.html is missing')
          text = p.read_text(encoding='utf-8')
          tags = [
              '<link rel="manifest" href="./manifest.webmanifest">',
              '<meta name="theme-color" content="#0284c7">',
              '<meta name="mobile-web-app-capable" content="yes">',
              '<meta name="apple-mobile-web-app-capable" content="yes">',
              '<meta name="apple-mobile-web-app-status-bar-style" content="default">',
              '<meta name="apple-mobile-web-app-title" content="Handwriting">',
              '<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">',
              '<link rel="stylesheet" href="./mobile-responsive.css">'
          ]
          for tag in tags:
              if tag not in text:
                  text = text.replace('</head>', f'  {tag}\n</head>', 1)
          script = '<script src="./pwa.js" defer></script>'
          if script not in text:
              text = text.replace('</body>', f'  {script}\n</body>', 1)
          p.write_text(text, encoding='utf-8')

      - name: Commit changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "chore(pwa): sync PWA metadata"
            git push
          fi
