name: Enable PWA

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject PWA metadata and registration
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          manifest = '<link rel="manifest" href="./manifest.webmanifest">'
          theme = '<meta name="theme-color" content="#0284c7">'
          mobile = '<meta name="mobile-web-app-capable" content="yes">'
          apple = '<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Handwriting">'
          icon = '<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">'
          script = '<script src="./pwa.js" defer></script>'

          additions = [manifest, theme, mobile, apple, icon]
          for tag in additions:
              if tag not in text:
                  text = text.replace('</head>', f'  {tag}\\n</head>', 1)

          if script not in text:
              text = text.replace('</body>', f'  {script}\\n</body>', 1)

          p.write_text(text, encoding='utf-8')

      - name: Commit injected PWA support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "PWA support already injected"
          else
            git commit -m "feat(pwa): enable installable app support [skip ci]"
            git push
          fi
