name: Android CI Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-*.yml'
      - 'android/**'
      - 'manifest.webmanifest'
      - 'index.html'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-*.yml'
      - 'android/**'
      - 'manifest.webmanifest'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_ID: np.com.laxmannepal.texttohandwriting
  COMPILE_SDK: '35'
  BUILD_TOOLS: '35.0.0'
  GRADLE_VERSION: '8.7'

jobs:
  validate:
    name: Validate Android build system
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -d "$SDK"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS}" "platform-tools"

      - name: Validate web manifest
        shell: python
        run: |
          import json
          from urllib.parse import urlparse
          p = json.load(open('manifest.webmanifest', encoding='utf-8'))
          assert p.get('name') == 'Text to Handwriting'
          assert p.get('short_name')
          assert p.get('start_url','').startswith('/Text-To-Handwriting/')
          assert p.get('scope','').startswith('/Text-To-Handwriting/')
          print('Web manifest: OK')

      - name: Validate Android identifiers
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PACKAGE_ID" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]
          echo "Package ID: $PACKAGE_ID"

      - name: Validate Gradle project when present
        if: ${{ hashFiles('android/**') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          echo 'Android project detected and structurally valid.'
